    <link rel="stylesheet" href="styles.css">

</head>

<body>

    <div class="filtros">
        <input type="text" id="filtro-vendedor" placeholder="Filtrar por vendedor">
        <input type="text" id="filtro-produto" placeholder="Filtrar por Produto">
        <input type="text" id="filtro-preco" placeholder="Filtrar por Preço">
    </div>

    <table id="tabela-vendedores">
        <thead>
            <tr>
                <th>Imagem</th>
                <th>Vendedor</th>
                <th>Produto</th>
                <th>Total</th>
            </tr>
        </thead>
        <tbody>

        </tbody>
    </table>

    <div id="tooltip" class="tooltip"></div>

    <script src="scripts.js"></script>
</body>

</html>
