<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">

</head>

<body>
    <div class="container mt-4">
        <h1 class="text-center">Funcionário por Departamento</h1>
        <div id="indicador-carregamento" class="text-center mt-4">Carregando...</div>
        <div id="conteudo" style="display: flex;">
            <input type="text" name="" id="campo-pesquisa" class="form-control mt-3"
                placeholder="Pesquisar por nome...">
            <div class="d-flex justify-content-between mt-3">
                <button id="exportar-selecionado" class="btn btn-primary">Exportar dados da aba selecionada</button>
                <button id="exportar-todos" class="btn btn-secondary">Exportar todos os dados</button>
            </div>
            <div id="container-abas" class="mt-4"></div>
            <div id="container-dados" class="mt-4"></div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.16.9/xlsx.full.min.js"></script>
    <script src="scripts.js"></script>
</body>

</html>
